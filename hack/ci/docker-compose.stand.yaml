# Integration/chaos stand: a real Traefik in front of traefik/whoami, with the
# plugin mounted as a local plugin.
#
# hack/ci/lib.sh brings it up and the scripts of hack/ci drive the scenarios.
# Every host port is a knob, so several stands (and several CI jobs) can run side
# by side, and the container log file is mounted, because the plugin messages are
# reported in the Traefik log, never on the process output.
#
# The dynamic configuration is generated by the calling script (DYNAMIC_FILE) and
# contains the routers and middlewares of the scenario.

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.8.0}
    command:
      - --log.level=${TRAEFIK_LOG_LEVEL:-DEBUG}
      - --log.filePath=/var/log/traefik/traefik.log
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:8000
      - --experimental.localplugins.cookieExtract.modulename=github.com/MichNG/traefik-cookie-extract
    ports:
      - "${HTTP_PORT:-18000}:8000"
      - "${API_PORT:-18080}:8080"
    volumes:
      # Only the runtime sources are mounted, so the stand also proves that the
      # plugin needs nothing but the Go standard library.
      - ${PLUGIN_DIR:?PLUGIN_DIR is not set}:/plugins-local/src/github.com/MichNG/traefik-cookie-extract:ro
      - ${DYNAMIC_FILE:?DYNAMIC_FILE is not set}:/etc/traefik/dynamic.yaml:ro
      - ${LOGS_DIR:?LOGS_DIR is not set}:/var/log/traefik

  target:
    image: traefik/whoami
