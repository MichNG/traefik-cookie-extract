name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "not gofmt-ed:"; echo "$fmt"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: tests (race)
        run: go test -race ./...

      # Loads the plugin with the same Yaegi interpreter Traefik uses: catches
      # interpreter incompatibilities that the Go compiler accepts.
      - name: yaegi compatibility check
        working-directory: tools/yaegicheck
        run: go run .

  e2e:
    name: e2e (Traefik ${{ matrix.traefik }})
    runs-on: ubuntu-latest
    strategy:
      # Every supported Traefik release is checked: the plugin depends on the
      # interpreter channel Traefik redirects into its own logger, and on the
      # local plugin loading.
      fail-fast: false
      matrix:
        traefik: ['v3.5', 'v3.6', 'v3.7', 'v3.8']
    env:
      TRAEFIK_VERSION: ${{ matrix.traefik }}
    steps:
      - uses: actions/checkout@v4

      # Loads the plugin in a real Traefik (local plugin) and checks the logging
      # behaviour: messages in the Traefik log file, nothing on the process
      # output (journald, /var/log/messages), logLevel: off is silent, and an
      # invalid configuration is rejected with an explicit error.
      - name: end to end verification (Traefik ${{ matrix.traefik }})
        run: ./e2e.sh
